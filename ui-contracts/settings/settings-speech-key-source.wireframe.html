<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Journey 17 — Settings · Speech (STT/TTS) Key Source · PM Wireframe</title>
<style>
  :root{
    --canvas-bg:#e7e2d8; --grid:rgba(43,36,29,.05);
    --win-shell:#efeae1; --win-pane:#f5f2eb; --rail:#efeae1;
    --surface:#ffffff; --text:#1f1b16; --muted:#6b655d; --tertiary:#9a938a;
    --accent:#c2703a; --accent-soft:rgba(194,112,58,.12); --active:#e9e2d6;
    --line:rgba(31,27,22,.08); --line2:rgba(31,27,22,.14);
    --ok:#2f7d51; --ok-soft:rgba(47,125,81,.12); --danger:#d5453f; --danger-soft:rgba(213,69,63,.1);
    --warn:#b56c1f; --warn-soft:rgba(194,112,58,.14);
    --toggle-on:#1c1a17; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas-bg);font-family:var(--font);color:var(--text)}
  /* top bar */
  .topbar{position:fixed;inset:0 0 auto 0;height:52px;z-index:20;display:flex;align-items:center;gap:14px;
    padding:0 16px;background:rgba(247,245,240,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line2)}
  .topbar h1{margin:0;font-size:14px;font-weight:800}
  .topbar .sub{font-size:12px;color:var(--muted)}
  .propTag{font-size:10px;font-weight:800;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn);padding:2px 8px;border-radius:999px}
  .ctrls{margin-left:auto;display:flex;gap:6px}
  .ctrls button{font:600 12px var(--font);border:1px solid var(--line2);background:#fff;color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer}
  .ctrls button:hover{border-color:var(--accent);color:var(--accent)}
  /* jump list */
  .jump{position:fixed;top:52px;left:0;bottom:0;width:190px;z-index:15;background:rgba(247,245,240,.9);
    border-right:1px solid var(--line2);padding:14px 12px;overflow:auto}
  .jump h2{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tertiary);margin:0 0 8px}
  .jump a{display:block;font-size:12px;font-weight:600;color:var(--text);text-decoration:none;padding:7px 9px;border-radius:8px;margin-bottom:3px;cursor:pointer}
  .jump a:hover{background:var(--active);color:var(--accent)}
  .jump .legend{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6}
  .jump .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  /* viewport / stage */
  .viewport{position:fixed;top:52px;left:190px;right:0;bottom:0;overflow:hidden;cursor:grab;
    background-image:radial-gradient(var(--grid) 1px,transparent 1px);background-size:26px 26px;touch-action:none;overscroll-behavior:contain}
  .viewport.grabbing{cursor:grabbing}
  .stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  /* bands */
  .band{position:absolute}
  .band .bh{position:relative;margin:0 0 14px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
    background:rgba(247,245,240,.96);border:1px solid var(--line2);border-radius:10px;padding:10px 14px;box-shadow:0 6px 16px rgba(31,27,22,.06)}
  .band .bh h3{margin:0;font-size:14px;font-weight:800}
  .band .bh span{font-size:11px;color:var(--muted)}
  .row{display:flex;align-items:flex-start;gap:46px}
  /* card wrapper */
  .card{position:relative}
  .card .cap{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .card .idp{font-size:11px;font-weight:800;color:#fff;background:#2a241d;border-radius:999px;padding:2px 8px}
  .card .cty{font-size:12px;font-weight:700}
  .card .cnote{font-size:11px;color:var(--muted);max-width:560px;margin:2px 0 8px;line-height:1.4}
  .arrow{align-self:center;flex:0 0 auto;width:34px;height:2px;background:var(--line2);position:relative}
  .arrow:after{content:"";position:absolute;right:-1px;top:-4px;border-left:8px solid var(--line2);border-top:5px solid transparent;border-bottom:5px solid transparent}
  /* ===== settings window (modeled ~1180x840, scaled) ===== */
  .win{width:1180px;height:840px;transform-origin:0 0;background:var(--win-shell);border:1px solid var(--line2);border-radius:18px;overflow:hidden;box-shadow:0 24px 60px rgba(31,27,22,.18);display:flex;flex-direction:column}
  .win .titlebar{height:46px;display:flex;align-items:center;padding:0 18px;gap:9px;flex:0 0 auto}
  .win .tl{width:13px;height:13px;border-radius:50%}
  .win .tl.r{background:#ff5f57}.win .tl.y{background:#febc2e}.win .tl.g{background:#28c840}
  .win .body{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
  /* sidebar */
  .sb{background:var(--rail);border-right:1px solid var(--line);padding:8px 20px 20px}
  .sb .back{font-size:15px;color:var(--muted);margin:6px 0 22px;display:flex;align-items:center;gap:8px}
  .sb .stitle{font-size:30px;font-weight:800;margin:0}
  .sb .ssub{font-size:15px;color:var(--muted);margin:6px 0 26px}
  .sb .nav a{display:flex;align-items:center;gap:13px;font-size:17px;color:var(--text);padding:12px 14px;border-radius:11px;margin-bottom:5px}
  .sb .nav a .ic{width:20px;height:20px;color:var(--tertiary);display:flex}
  .sb .nav a.on{background:var(--active);font-weight:600}
  .sb .nav a.on .ic{color:var(--accent)}
  /* right pane */
  .pane{background:var(--win-pane);padding:34px 40px;overflow:hidden}
  .pane h2{font-size:30px;font-weight:800;margin:0}
  .pane .pdesc{font-size:16px;color:var(--muted);margin:8px 0 26px}
  .grp{font-size:13px;font-weight:800;letter-spacing:.09em;color:var(--tertiary);text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
  .grp .pp{font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-soft);border:1px dashed var(--warn);border-radius:999px;padding:1px 9px;letter-spacing:0;text-transform:none}
  .scard{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:0 1px 0 rgba(31,27,22,.02);margin-bottom:30px}
  .scard.proposed{border:1.5px dashed var(--accent);box-shadow:0 8px 26px rgba(194,112,58,.1)}
  .r{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 22px}
  .r + .r{border-top:1px solid var(--line)}
  .r .rl .rt{font-size:18px;font-weight:600}
  .r .rl .rd{font-size:14px;color:var(--muted);margin-top:3px}
  .r .rr{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  /* controls */
  .pill{font-size:14px;font-weight:700;border-radius:999px;padding:5px 13px}
  .pill.plat{background:rgba(154,147,138,.16);color:var(--muted)}
  .pill.your{background:var(--ok-soft);color:var(--ok)}
  .pill.run{background:var(--accent-soft);color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
  .seg span{font-size:13px;font-weight:700;padding:7px 14px;color:var(--muted);background:#fff}
  .seg span.on{background:var(--accent-soft);color:var(--accent)}
  .seg span + span{border-left:1px solid var(--line2)}
  .btn{font-size:15px;font-weight:600;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 16px;display:inline-flex;align-items:center;gap:8px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{border-color:rgba(213,69,63,.4);color:var(--danger)}
  .inp{min-width:300px;font:15px var(--mono);color:var(--muted);background:#fff;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .inp.err{border-color:var(--danger)}
  .inp .rep{font:600 13px var(--font);color:var(--accent)}
  .sel{min-width:210px;font-size:15px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sel .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px}
  .tog{width:52px;height:30px;border-radius:999px;background:#d8d2c8;position:relative;flex:0 0 auto}
  .tog.on{background:var(--toggle-on)}
  .tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:none}
  .tog.on:after{left:25px}
  .expand{padding:0 22px 20px;border-top:1px solid var(--line)}
  .expand .fl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:16px}
  .inlineErr{font-size:14px;color:var(--danger);font-weight:600;margin-top:12px}
  .spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;display:inline-block;vertical-align:-2px;margin-right:8px}
  .subnote{font-size:13px;color:var(--tertiary);margin-top:10px}
  /* compact support cards */
  .sum{width:520px;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px 18px;box-shadow:0 8px 22px rgba(31,27,22,.06)}
  .sum h4{margin:0 0 8px;font-size:14px;font-weight:800}
  .sum p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
  .sum .k{display:inline-flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .sum .k b{font-size:11px;font-weight:700;border:1px solid var(--line2);border-radius:7px;padding:4px 9px;color:var(--text);background:#faf8f4}
  /* pm callout */
  .pm{width:520px;border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5}
  .pm.y{background:#fff3cd;border:1px solid #e6d48a}
  .pm.r{background:#f8d7da;border:1px solid #e6a3a8}
  .pm b{display:block;margin-bottom:4px}
  .confirm{position:absolute;inset:0;background:rgba(31,27,22,.28);display:flex;align-items:center;justify-content:center;border-radius:0}
  .confirm .box{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:26px 28px;width:520px;box-shadow:0 30px 70px rgba(31,27,22,.3)}
  .confirm .box h5{margin:0 0 10px;font-size:20px;font-weight:800}
  .confirm .box p{margin:0 0 20px;font-size:15px;color:var(--muted);line-height:1.5}
  .confirm .box .fl{display:flex;gap:12px;justify-content:flex-end}
</style>
</head>
<body>
<div class="topbar">
  <h1>Journey 17 — Settings · Speech (STT/TTS) Key Source</h1>
  <span class="propTag">PROPOSED · not built yet</span>
  <span class="sub">visual reference: current NoraHarness Settings</span>
  <div class="ctrls">
    <button id="zo">– Zoom</button><button id="zi">+ Zoom</button>
    <button id="fit">Fit</button><button id="reset">Reset</button>
  </div>
</div>

<nav class="jump">
  <h2>Bands</h2>
  <a data-band="b-main">Main happy path</a>
  <a data-band="b-route">Route path</a>
  <a data-band="b-detail">Detail states</a>
  <a data-band="b-lang">State language</a>
  <a data-band="b-err">Errors and recovery</a>
  <a data-band="b-pm">PM decisions</a>
  <div class="legend">
    <div><b style="background:#e9e2d6"></b>current UI shell</div>
    <div><b style="background:var(--accent);border:1px dashed var(--accent)"></b>proposed section</div>
    <div><b style="background:#fff3cd"></b>PM decision</div>
    <div><b style="background:#f8d7da"></b>blocking decision</div>
  </div>
</nav>

<div class="viewport" id="vp">
  <div class="stage" id="stage"></div>
</div>

<script>
/* ---------- icons (thin inline svg) ---------- */
const IC = {
  gear:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
  file:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  key:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 5l2 2M14 8l2 2"/></svg>',
  shield:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>',
  device:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg>',
  info:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  mic:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4"/></svg>'
};
function nav(active){
  const items=[['gear','General'],['file','Workspace'],['key','Providers'],['mic','Voice'],['shield','Permissions'],['device','Remote control'],['info','About']];
  return items.map(([ic,l])=>`<a class="${l===active?'on':''}"><span class="ic">${IC[ic]}</span>${l}</a>`).join('');
}
/* existing voice-settings group (context, current Voice tab) */
const voiceGroup = `
  <div class="grp">Voice wake</div>
  <div class="scard">
    <div class="r"><div class="rl"><div class="rt">Voice wake</div><div class="rd">Listen for a trigger word.</div></div>
      <div class="rr"><div class="tog on"></div></div></div>
    <div class="r"><div class="rl"><div class="rt">Microphone</div><div class="rd">Audio input device.</div></div>
      <div class="rr"><div class="sel">Default microphone <span style="color:var(--tertiary)">▾</span></div></div></div>
  </div>`;

/* ---------- speech section per state ---------- */
function sttRow(inner){return inner;}
function speech(state){
  const badge=(k)=> k==='plat'?'<span class="pill plat">Platform default</span>':'<span class="pill your">Your key ✓</span>';
  const toggle=(sel)=>`<div class="seg"><span class="${sel==='plat'?'on':''}">Platform</span><span class="${sel==='my'?'on':''}">My key</span></div>`;
  // rows for STT and TTS given a config
  function row(name,desc,right){return `<div class="r"><div class="rl"><div class="rt">${name}</div><div class="rd">${desc}</div></div><div class="rr">${right}</div></div>`;}
  let stt='', tts='', expand='';
  switch(state){
    case 1: // entry, both platform badges
      stt=row('Speech-to-text','Voice input transcription.',badge('plat'));
      tts=row('Text-to-speech','Spoken reply voice.',badge('plat'));
      break;
    case 2: // review with toggles
      stt=row('Speech-to-text','Voice input transcription.',toggle('plat'));
      tts=row('Text-to-speech','Spoken reply voice.',toggle('plat'));
      break;
    case '3.1': // STT my key expanded
      stt=row('Speech-to-text','Voice input transcription.',toggle('my'));
      expand=`<div class="expand"><div class="fl"><div class="inp">Paste your speech-to-text key<span class="rep">Paste</span></div><span class="btn pri">Save key</span><span class="btn">Cancel</span></div></div>`;
      tts=row('Text-to-speech','Spoken reply voice.',badge('plat'));
      break;
    case '3.2': // TTS my key expanded (provider select)
      stt=row('Speech-to-text','Voice input transcription.',badge('plat'));
      tts=row('Text-to-speech','Spoken reply voice.',toggle('my'));
      expand=`<div class="expand"><div class="fl"><div class="sel">Provider · qwen-realtime <span style="color:var(--tertiary)">▾</span></div><div class="inp">Paste your text-to-speech key<span class="rep">Paste</span></div><span class="btn pri">Save key</span></div></div>`;
      break;
    case 4: // uploading
      stt=row('Speech-to-text','Voice input transcription.',toggle('my'));
      expand=`<div class="expand"><div class="fl"><div class="inp">••••••••••••••••<span class="rep">Replace</span></div><span style="font-size:15px;font-weight:700;color:var(--accent)"><span class="spin"></span>Uploading…</span></div></div>`;
      tts=row('Text-to-speech','Spoken reply voice.',badge('plat'));
      break;
    case 5: // active
      stt=row('Speech-to-text','Voice input transcription.',badge('your'));
      expand=`<div class="expand"><div class="fl"><div class="inp">key ····3f9a · fingerprint c4d1<span class="rep">Replace</span></div><span class="btn">Revert to platform default</span></div></div>`;
      tts=row('Text-to-speech','Spoken reply voice.',badge('plat'));
      break;
    case '4.2': // invalid
      stt=row('Speech-to-text','Voice input transcription.',toggle('my'));
      expand=`<div class="expand"><div class="fl"><div class="inp err">••••••••<span class="rep">Replace</span></div><span class="btn pri">Retry</span><span class="btn">Revert to platform</span></div><div class="inlineErr">Invalid key — the provider rejected it. Speech is still on the platform default.</div></div>`;
      tts=row('Text-to-speech','Spoken reply voice.',badge('plat'));
      break;
    case '4.3': // upload failed
      stt=row('Speech-to-text','Voice input transcription.',toggle('my'));
      expand=`<div class="expand"><div class="fl"><div class="inp">••••••••<span class="rep">Replace</span></div><span class="btn pri">Retry</span></div><div class="inlineErr">Upload failed — could not save the key. Nothing was changed.</div></div>`;
      tts=row('Text-to-speech','Spoken reply voice.',badge('plat'));
      break;
  }
  return `<div class="grp">Speech keys <span class="pp">Proposed</span></div>
    <div class="scard proposed">${stt}${expand}${tts}</div>`;
}
/* full settings window for a given speech state; confirm overlay optional (3.3) */
function win(state,confirm){
  const overlay = confirm?`<div class="confirm"><div class="box"><h5>Revert Speech-to-text to platform default?</h5><p>Your uploaded speech-to-text key will be removed. The agent will use the platform default key on its next start.</p><div class="fl"><span class="btn">Cancel</span><span class="btn danger">Revert</span></div></div></div>`:'';
  return `<div class="win" style="position:relative">
    <div class="titlebar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span></div>
    <div class="body">
      <div class="sb"><div class="back">← Back to app</div><div class="stitle">Settings</div><div class="ssub">NoraHarness preferences</div><div class="nav">${nav('Voice')}</div></div>
      <div class="pane"><h2>Voice</h2><div class="pdesc">Voice wake, audio, and speech keys for the cloud agent.</div>${voiceGroup}${speech(state)}</div>
    </div>${overlay}</div>`;
}
/* card wrapper with id pill + caption; SCALE controls the visible size */
const SCALE=0.5;
function card(id,ty,note,state,confirm){
  return `<div class="card"><div class="cap"><span class="idp">${id}</span><span class="cty">${ty}</span></div>
    <div class="cnote">${note}</div>
    <div style="width:${1180*SCALE}px;height:${840*SCALE}px"><div class="win" style="position:relative;transform:scale(${SCALE})">${win(state,confirm).replace(/^<div class="win"[^>]*>/,'').replace(/<\/div>$/,'')}</div></div></div>`;
}
/* simpler: build window then scale wrapper */
function frame(id,ty,note,state,confirm){
  const inner=win(state,confirm);
  return `<div class="card"><div class="cap"><span class="idp">${id}</span><span class="cty">${ty}</span></div>
    <div class="cnote">${note}</div>
    <div style="width:${1180*SCALE}px;height:${840*SCALE}px;overflow:hidden">
      <div style="transform:scale(${SCALE});transform-origin:0 0">${inner}</div>
    </div></div>`;
}
const arrow=`<div class="arrow"></div>`;

/* ---------- bands layout ---------- */
const stage=document.getElementById('stage');
let html='';

/* MAIN HAPPY PATH */
const main=[
  ['1','Entry','Providers page → Speech keys group. Both capabilities on Platform default; nothing required.',1],
  ['2','Review source','Each row shows its source; toggle Platform | My key.',2],
  ['3.1','STT · use my own key','Masked key field + Save. Choice staged, not yet uploaded.','3.1'],
  ['4','Uploading','Key uploaded encrypted and validated.',4],
  ['5','Active','Your key ✓ with fingerprint. Agent uses it on next start.',5],
];
html+=`<div class="band" id="b-main" style="left:60px;top:40px"><div class="bh"><h3>Main happy path</h3><span>1 → 2 → 3 → 4 → 5 · bring your own speech-to-text key</span></div>
  <div class="row">${main.map((m,i)=>frame(m[0],m[1],m[2],m[3])+(i<main.length-1?arrow:'')).join('')}</div></div>`;

/* ROUTE PATH */
const rowH=840*SCALE+120;
const routes=[
  ['Bring your own TTS key','1 → 2 → 3.2 → 4 → 5',[['1','Entry','',1],['2','Review','',2],['3.2','TTS · my key','Provider picker + key.','3.2'],['4','Uploading','',4],['5','Active','',5]]],
  ['Invalid key → correct → retry','1 → 2 → 3.1 → 4 → 4.2 → 4 → 5',[['3.1','STT · my key','',"3.1"],['4','Uploading','',4],['4.2','Invalid key','Provider rejected it.','4.2'],['4','Retry','',4],['5','Active','',5]]],
  ['Upload failed → retry','1 → 2 → 3.2 → 4 → 4.3 → 4 → 5',[['3.2','TTS · my key','',"3.2"],['4','Uploading','',4],['4.3','Upload failed','Storage error.','4.3'],['5','Active','',5]]],
  ['Revert to platform default','1 → 2 → 3.3 → 5',[['5','Active (your key)','Starting point.',5],['3.3','Revert confirm','Confirm removes the key.',5,true],['5b','Platform default','Row back to platform.',1]]],
];
let routeTop=40;
html+=`<div class="band" id="b-route" style="left:60px;top:${640}px"><div class="bh"><h3>Route path</h3><span>every route from the record, full frames</span></div></div>`;
let routesHtml='';
routes.forEach((rt,ri)=>{
  routesHtml+=`<div class="band" style="left:60px;top:${740+ri*rowH}px"><div class="bh"><h3>Route · ${rt[0]}</h3><span>${rt[1]}</span></div>
    <div class="row">${rt[2].map((c,i)=>frame(c[0],c[1],c[2]||'',c[3],c[4])+(i<rt[2].length-1?arrow:'')).join('')}</div></div>`;
});
html+=routesHtml;

/* support bands below routes */
const supTop=740+routes.length*rowH+40;
/* DETAIL STATES */
html+=`<div class="band" id="b-detail" style="left:60px;top:${supTop}px"><div class="bh"><h3>Detail states</h3><span>4.1 · 5.1</span></div>
  <div class="row" style="gap:28px">
    <div class="sum"><div class="cap" style="display:flex;gap:8px;margin-bottom:6px"><span class="idp">4.1</span><span class="cty">How the source is chosen at agent start</span></div>
      <p>On start, the agent uses your uploaded key if one exists, otherwise the platform default. This screen decides which key is on file; a running agent adopts a change on its next start.</p></div>
    <div class="sum"><div class="cap" style="display:flex;gap:8px;margin-bottom:6px"><span class="idp">5.1</span><span class="cty">Key stays hidden; source is shown</span></div>
      <p>Uploaded keys are masked, stored sealed, and never shown again in readable form. The row names the active source and a short fingerprint, never the key value.</p></div>
  </div></div>`;

/* STATE LANGUAGE */
html+=`<div class="band" id="b-lang" style="left:60px;top:${supTop+300}px"><div class="bh"><h3>State language</h3><span>0.1</span></div>
  <div class="row"><div class="sum" style="width:820px"><div class="cap" style="display:flex;gap:8px;margin-bottom:6px"><span class="idp">0.1</span><span class="cty">Source badges · status · actions</span></div>
    <div class="k"><b>Platform default</b><b>Your key</b></div>
    <div class="k">Status: <b>Saved ✓</b><b>Uploading…</b><b>Invalid key</b><b>Upload failed</b></div>
    <div class="k">Actions: <b>Use my own key</b><b>Save key</b><b>Replace</b><b>Revert to platform default</b><b>Retry</b></div>
    <p style="margin-top:10px">The active source is always named by source and fingerprint, never by showing the key.</p></div></div></div>`;

/* ERRORS & RECOVERY */
html+=`<div class="band" id="b-err" style="left:60px;top:${supTop+540}px"><div class="bh"><h3>Errors and recovery</h3><span>4.2 · 4.3 · 0.2</span></div>
  <div class="row" style="gap:28px">
    <div class="sum"><div class="cap" style="display:flex;gap:8px;margin-bottom:6px"><span class="idp">4.2</span><span class="cty">Key invalid / rejected</span></div>
      <p>Validation rejects the key. Inline "Invalid key"; nothing saved; previous source stays active. Correct and Retry, or Revert to platform.</p></div>
    <div class="sum"><div class="cap" style="display:flex;gap:8px;margin-bottom:6px"><span class="idp">4.3</span><span class="cty">Upload failed</span></div>
      <p>A storage error prevents saving. "Upload failed" with Retry; nothing partial is written; previous source stays active.</p></div>
    <div class="sum"><div class="cap" style="display:flex;gap:8px;margin-bottom:6px"><span class="idp">0.2</span><span class="cty">Correct / retry / revert / leave</span></div>
      <p>Every failure keeps you in the section with the previous source intact, names the cause, and offers the matching action. Leaving discards an unsaved change.</p></div>
  </div></div>`;

/* PM DECISIONS */
html+=`<div class="band" id="b-pm" style="left:60px;top:${supTop+840}px"><div class="bh"><h3>PM decisions</h3><span>resolve before build</span></div>
  <div class="row" style="gap:24px;flex-wrap:wrap;max-width:1720px">
    <div class="pm y"><b>1 · Placement</b>Speech keys under Providers (grounded in current UI, recommended) vs a hidden Voice tab.</div>
    <div class="pm y"><b>2 · Granularity</b>Separate STT and TTS source choices (recommended) vs one combined speech key.</div>
    <div class="pm y"><b>3 · TTS provider</b>Let the user pick the TTS provider (recommended) vs infer it.</div>
    <div class="pm y"><b>4 · Validation</b>Quick validate on save (recommended) vs accept and fail later.</div>
    <div class="pm r"><b>5 · Fallback visibility (blocking)</b>Never silently fall back to the platform key when the user chose "my key" — show the failure and the active source.</div>
  </div></div>`;

stage.innerHTML=html;

/* ---------- pan / zoom ---------- */
const vp=document.getElementById('vp');
let s=0.5,px=20,py=20,drag=false,lx=0,ly=0,pend=false;
function draw(){pend=false;stage.style.transform=`translate(${px}px,${py}px) scale(${s})`;}
function apply(){if(pend)return;pend=true;requestAnimationFrame(draw);}
draw();
vp.addEventListener('pointerdown',e=>{drag=true;vp.classList.add('grabbing');lx=e.clientX;ly=e.clientY;vp.setPointerCapture(e.pointerId);});
vp.addEventListener('pointermove',e=>{if(!drag)return;px+=e.clientX-lx;py+=e.clientY-ly;lx=e.clientX;ly=e.clientY;apply();});
vp.addEventListener('pointerup',e=>{drag=false;vp.classList.remove('grabbing');});
vp.addEventListener('pointercancel',()=>{drag=false;vp.classList.remove('grabbing');});
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey||e.metaKey){
    const r=vp.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
    const ns=Math.min(2,Math.max(.08,s*(e.deltaY<0?1.1:0.9)));
    px=mx-(mx-px)*(ns/s);py=my-(my-py)*(ns/s);s=ns;
  }else{px-=e.deltaX;py-=e.deltaY;}
  apply();
},{passive:false});
function bounds(){let w=0,h=0;stage.querySelectorAll('.band').forEach(b=>{const l=b.offsetLeft+b.offsetWidth,t=b.offsetTop+b.offsetHeight;if(l>w)w=l;if(t>h)h=t;});return[w+80,h+80];}
document.getElementById('zi').onclick=()=>{s=Math.min(2,s*1.15);apply();};
document.getElementById('zo').onclick=()=>{s=Math.max(.08,s/1.15);apply();};
document.getElementById('reset').onclick=()=>{s=.5;px=20;py=20;apply();};
document.getElementById('fit').onclick=()=>{const[w,h]=bounds();const r=vp.getBoundingClientRect();if(w>0&&h>0){s=Math.max(.08,Math.min(r.width/w,r.height/h,1));}px=20;py=20;apply();};
document.querySelectorAll('.jump a').forEach(a=>{a.onclick=()=>{const b=document.getElementById(a.dataset.band);if(!b)return;s=Math.max(.5,Math.min(s,.72));px=40-b.offsetLeft*s;py=90-b.offsetTop*s;apply();};});
</script>
</body>
</html>
